name: Android ARM64 test-installable preview

on:
  pull_request:
    paths:
      - .github/workflows/android-arm64-preview.yml
      - docs/ANDROID_PREVIEW.md
      - android/**
      - pubspec.yaml
      - pubspec.lock
  push:
    branches: [main]
    paths:
      - .github/workflows/android-arm64-preview.yml
      - android/**
      - pubspec.yaml
      - pubspec.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-arm64-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-arm64-preview:
    name: android-arm64-preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build ARM64 APK (debug signing for test devices ONLY)
        run: flutter build apk --release --target-platform android-arm64
      - name: Audit release dependencies, manifest and APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          report="$RUNNER_TEMP/release-runtime.txt"
          ./android/gradlew -p android :app:dependencies --configuration releaseRuntimeClasspath > "$report"
          if grep -Eq 'com\.google\.android\.gms:|com\.google\.firebase:' "$report"; then
            echo "Prohibited GMS/Firebase runtime dependency"
            exit 1
          fi
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          aapt="$(find "$sdk/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$sdk/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$aapt"
          test -n "$apksigner"
          "$aapt" dump permissions "$apk" | grep -q 'android.permission.INTERNET'
          "$apksigner" verify "$apk"
          echo "ARM64 preview: APK signed, INTERNET permission present, no GMS/Firebase runtime deps"
      - uses: actions/upload-artifact@v4
        with:
          name: cloudmail-player-android-arm64-debug-signed-preview
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
