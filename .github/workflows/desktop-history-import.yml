name: One-time desktop assets restore (no history import)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-snapshot-asset-restore
  cancel-in-progress: false

jobs:
  restore-assets:
    if: github.repository == 'metravolokos/dT-cLmL' && github.ref == 'refs/heads/migration/desktop-snapshot-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out destination branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Retrieve only original Windows icon and resource manifest
        shell: bash
        run: |
          set -euo pipefail
          source_sha='2d373369bfe0e7b256dd98534cc90933336e3811'
          git remote add original https://github.com/metravolokos/cloudmail-player-m0.git
          git fetch --no-tags original "$source_sha"
          test "$(git rev-parse FETCH_HEAD)" = "$source_sha"
          git checkout "$source_sha" -- windows/runner/resources/app_icon.ico windows/runner/Runner.rc
          test -s windows/runner/resources/app_icon.ico
          test "$(git hash-object windows/runner/resources/app_icon.ico)" = 'c04e20caf6370ebb9253ad831cc31de4a9c965f6'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add windows/runner/resources/app_icon.ico windows/runner/Runner.rc
          git diff --cached --quiet || git commit -m 'Restore original Windows icon and RC from frozen source snapshot'
      - name: Push snapshot-only commit (never import source history)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'migration/desktop-snapshot-20261106'
          git push origin HEAD:refs/heads/migration/desktop-snapshot-20261106
