name: CloudMail Player — three platforms
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: three-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: python -m unittest discover -s tests -v
      - run: bash tools/check_layers.sh

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug
      - name: No GMS or Firebase runtime dependencies
        shell: bash
        run: |
          report="$RUNNER_TEMP/gradle-runtime.txt"
          ./android/gradlew -p android :app:dependencies --configuration debugRuntimeClasspath > "$report"
          if grep -Eq 'com\.google\.android\.gms:|com\.google\.firebase:' "$report"; then
            echo 'Prohibited Google runtime dependency'
            exit 1
          fi
          echo 'No GMS/Firebase dependency found'
      - name: Audit Android release manifest INTERNET permission
        shell: bash
        run: |
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
      - uses: actions/upload-artifact@v4
        with:
          name: cloudmail-player-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: cloudmail-player-windows
          path: build/windows/x64/runner/Release/

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Linux GTK and secret store toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get --enforce-lockfile
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: cloudmail-player-linux-x64
          path: build/linux/x64/release/bundle/
